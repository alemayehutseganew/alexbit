services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      PORT: 3000
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_API_URL: http://api:3001
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      AUTH_KEYCLOAK_CLIENT_ID: ${AUTH_KEYCLOAK_CLIENT_ID:?Set AUTH_KEYCLOAK_CLIENT_ID in .env}
      AUTH_KEYCLOAK_CLIENT_SECRET: ${AUTH_KEYCLOAK_CLIENT_SECRET:?Set AUTH_KEYCLOAK_CLIENT_SECRET in .env}
      AUTH_KEYCLOAK_CLIENT_ISSUER: ${AUTH_KEYCLOAK_CLIENT_ISSUER:?Set AUTH_KEYCLOAK_CLIENT_ISSUER in .env}
      AUTH_KEYCLOAK_SHAREHOLDER_ID: ${AUTH_KEYCLOAK_SHAREHOLDER_ID:?Set AUTH_KEYCLOAK_SHAREHOLDER_ID in .env}
      AUTH_KEYCLOAK_SHAREHOLDER_SECRET: ${AUTH_KEYCLOAK_SHAREHOLDER_SECRET:?Set AUTH_KEYCLOAK_SHAREHOLDER_SECRET in .env}
      AUTH_KEYCLOAK_SHAREHOLDER_ISSUER: ${AUTH_KEYCLOAK_SHAREHOLDER_ISSUER:?Set AUTH_KEYCLOAK_SHAREHOLDER_ISSUER in .env}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-primehorizon}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-primehorizon}?schema=public
      AUTH_KEYCLOAK_CLIENT_ISSUER: ${AUTH_KEYCLOAK_CLIENT_ISSUER:?Set AUTH_KEYCLOAK_CLIENT_ISSUER in .env}
      AUTH_KEYCLOAK_SHAREHOLDER_ISSUER: ${AUTH_KEYCLOAK_SHAREHOLDER_ISSUER:?Set AUTH_KEYCLOAK_SHAREHOLDER_ISSUER in .env}
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE:?Set KEYCLOAK_API_AUDIENCE in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-primehorizon}
      POSTGRES_USER: ${POSTGRES_USER:-primehorizon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
